<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WNC Strategic LLC | War Never Changes</title>
    <style>
        /* Reset & Base Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html {
            scroll-behavior: smooth;
        }

        body, html {
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0a0c10;
            color: #e2e8f0;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Fixed Background Video & Overlay */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        
        .bg-video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            opacity: 0.45; 
            /* Zoom in 15% and anchor to bottom-left to crop out the top-right NATO logo */
            transform: scale(1.15);
            transform-origin: bottom left;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 12, 16, 0.55);
            z-index: 1;
        }

        /* Top OSINT News Ticker */
        .ticker-wrap {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 1px solid #333;
            z-index: 20;
            padding: 8px 0;
            overflow: hidden;
            font-family: monospace;
            color: #4ade80;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .ticker {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: ticker 30s linear infinite;
        }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* Navigation Header */
        header {
            position: fixed;
            top: 34px; /* Sits just below the ticker */
            width: 100%;
            background: rgba(10, 12, 16, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 15;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        .logo {
            height: 45px;
            width: auto;
        }

        .brand-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        nav a {
            color: #94a3b8;
            text-decoration: none;
            margin-left: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #ffffff;
        }

        /* Main Content Wrapper */
        .content-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Section Formatting */
        section {
            width: 100%;
            max-width: 1200px;
            padding: 120px 20px 60px 20px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 2rem;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        /* Hero Section */
        #home {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-top: 80px;
        }

        #home h1 {
            font-size: 3.5rem;
            letter-spacing: 4px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        #home p {
            font-size: 1.2rem;
            color: #94a3b8;
            max-width: 700px;
        }

        /* Offerings Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .card {
            background: rgba(20, 25, 35, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 4px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card h3 {
            color: #ffffff;
            margin-bottom: 15px;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .card p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        /* Forms (Newsletter & Contact) */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 600px;
        }

        input, textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            color: #ffffff;
            font-family: inherit;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #4ade80;
        }

        textarea {
            resize: vertical;
            min-height: 150px;
        }

        button {
            background: #ffffff;
            color: #0a0c10;
            border: none;
            padding: 15px 30px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.3s ease;
            max-width: 200px;
        }

        button:hover {
            background: #4ade80;
        }

        .newsletter-row {
            display: flex;
            gap: 10px;
            max-width: 600px;
        }
        
        .newsletter-row input {
            flex-grow: 1;
        }

        /* Footer & Socials */
        footer {
            width: 100%;
            background: rgba(5, 7, 10, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 5%;
            margin-top: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .social-links a {
            color: #94a3b8;
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .social-links a:hover {
            color: #ffffff;
        }

        .footer-text {
            color: #64748b;
            font-size: 0.85rem;
