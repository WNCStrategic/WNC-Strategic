<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WNC Strategic LLC | War Never Changes</title>
    <style>
        /* Reset & Base Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0a0c10; /* Fallback background */
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* Background Video - FIXED Z-INDEX */
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0; /* Shifted to 0 so it sits above the body background */
            overflow: hidden;
        }
        .bg-video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            opacity: 0.45; 
        }

        /* Lighter Dark Overlay Mask */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 12, 16, 0.55);
            z-index: 1; /* Shifted to 1 so it sits above the video */
        }

        /* Content Container */
        .content-wrapper {
            position: relative;
            z-index: 2; /* Shifted to 2 so text stays on top of everything */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #ffffff;
            text-transform: uppercase;
        }

        p {
            font-size: 1.1rem;
            color: #94a3b8;
            max-width: 600px;
        }
    </style>
</head>
<body>

    <!-- Background Video Layer -->
    <div class="video-container">
        <video autoplay muted loop playsinline class="bg-video">
            <source src="background.mp4" type="video/mp4">
        </video>
    </div>
    <div class="video-overlay"></div>

    <!-- Main Site Content -->
    <div class="content-wrapper">
        <h1>WNC Strategic LLC</h1>
        <p>War Never Changes — Open-Source Intelligence & Geopolitical Risk Analysis</p>
    </div>

</body>
</html>
